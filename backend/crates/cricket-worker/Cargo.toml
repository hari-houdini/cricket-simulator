[package]
name = "cricket-worker"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# `cdylib` is the wasm module Cloudflare runs. `rlib` lets the host tests link the service.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cricket-core = { path = "../cricket-core" }
serde.workspace = true
serde_json.workspace = true

# Cloudflare runtime SDK (AGENTS.md approved list). Wasm only, so host tests never link it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.7"
